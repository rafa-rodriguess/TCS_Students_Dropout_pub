[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-orchestrator"
version = "0.1.5"
description = "Comunicação persistente e assíncrona entre IAs via GitHub Issues, reutilizável em N projetos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
ia-orchestrator = "ia_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ia_orchestrator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
